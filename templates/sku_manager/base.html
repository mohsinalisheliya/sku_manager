<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Jewelry Inventory Suite{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .sku-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between p-5 min-h-screen fixed left-0 top-0 z-30">
    <div class="space-y-6">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 px-2">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-amber-500/20">
          V
        </div>
        <div>
          <div class="font-extrabold text-white text-base tracking-wide leading-tight">VELFIRA</div>
          <div class="text-[10px] text-amber-400 uppercase font-semibold tracking-wider">SKU & Inventory</div>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1.5 pt-4">
        <!-- SKU Generator Link -->
        <a href="{% url 'sku_generate' %}" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'generator' %}bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 font-bold{% else %}text-slate-400 hover:bg-slate-800/80 hover:text-white{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          SKU Generator
        </a>

        <!-- Inventory Link -->
        <a href="{% url 'sku_inventory' %}" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition {% if active_page == 'inventory' %}bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20 font-bold{% else %}text-slate-400 hover:bg-slate-800/80 hover:text-white{% endif %}">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2 1.5 3 3.5 3h9c2 0 3.5-1 3.5-3V7c0-2-1.5-3-3.5-3h-9C5.5 4 4 5 4 7zm0 4h16M9 4v4m6-4v4"></path></svg>
          Inventory Catalog
        </a>

        <!-- Export CSV Link -->
        <a href="{% url 'sku_export_csv' %}" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          Export CSV
        </a>
      </nav>
    </div>

    <!-- Sidebar Bottom Status Card -->
    <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 text-[11px] text-slate-500 space-y-1">
      <div class="flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="text-slate-300 font-semibold">SQLite Active</span>
      </div>
      <p>Auto-Push Git Daemon: 5s</p>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 ml-64 p-6 sm:p-10 min-h-screen bg-slate-900">
    <div class="max-w-6xl mx-auto space-y-6">

      <!-- Flash Messages -->
      {% if messages %}
        {% for msg in messages %}
          <div class="p-4 rounded-xl text-sm font-semibold border {% if msg.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-300{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-300{% endif %}">
            {{ msg }}
          </div>
        {% endfor %}
      {% endif %}

      {% block content %}{% endblock %}

    </div>
  </main>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
