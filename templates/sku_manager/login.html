<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Tatkal Pick</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors">

  <div class="w-full max-w-md space-y-6">

    {% if messages %}
      {% for msg in messages %}
        <div class="px-4 py-3 rounded-2xl text-xs font-bold border shadow-sm {% if msg.tags == 'error' %}bg-rose-500/10 border-rose-500/30 text-rose-500{% else %}bg-emerald-500/10 border-emerald-500/30 text-emerald-600{% endif %}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}

    <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 rounded-3xl p-8 shadow-xl space-y-6">
      
      <!-- Brand & Speed-Box Logo -->
      <div class="text-center space-y-2">
        <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-400 items-center justify-center shadow-lg shadow-amber-500/20 mb-1">
          <svg class="w-8 h-8 text-slate-950" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/>
            <path d="M12 22V12"/>
            <path d="m13 7-4 5h4l-2 5" class="stroke-slate-950 fill-amber-300" stroke-width="2"/>
          </svg>
        </div>
        <h1 class="text-2xl font-black text-slate-900 dark:text-white tracking-tight">TATKAL PICK</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 font-medium">Universal Stock & Fast Dispatch Engine</p>
      </div>

      <!-- Login Form -->
      <form method="POST" action="{% url 'login' %}" class="space-y-4">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}">

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Username</label>
          <input type="text" name="username" required autofocus placeholder="Enter your username"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-amber-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Password</label>
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:border-amber-500 transition">
        </div>

        <button type="submit" 
          class="w-full bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black py-3 px-4 rounded-xl transition shadow-md shadow-amber-500/20 text-xs uppercase tracking-wider">
          Sign In to Portal
        </button>
      </form>

    </div>

  </div>
</body>
</html>
