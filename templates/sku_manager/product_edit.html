{% extends "sku_manager/base.html" %}

{% block title %}Edit Product: {{ product.name }} - Tatkal Pick{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">

  <header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-4">
    <div>
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">Edit Product Detail Only</h1>
      <p class="text-xs text-slate-500 font-mono mt-0.5">SKU: {{ product.sku }}</p>
    </div>
    <a href="{% url 'product_master' %}" class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold px-4 py-2 rounded-xl text-xs transition">
      ← Back to Products
    </a>
  </header>

  <div class="bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 rounded-3xl p-6 shadow-sm">
    <form method="POST" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Product Name</label>
          <input type="text" name="name" value="{{ product.name }}" required
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Product Category</label>
          <input type="text" name="category" value="{{ product.category }}"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Product Style</label>
          <input type="text" name="style" value="{{ product.style }}"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Product Design / Model</label>
          <input type="text" name="design_model" value="{{ product.design_model }}"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Product Size</label>
          <input type="text" name="size" value="{{ product.size }}"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Product Color</label>
          <input type="text" name="color" value="{{ product.color }}"
            class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3.5 py-2 text-xs text-slate-900 dark:text-white">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-700 dark:text-slate-300 mb-1">Change Image</label>
        <div class="flex items-center gap-3">
          {% if product.image %}
            <img src="{{ product.image.url }}" class="w-12 h-12 rounded-xl object-cover border border-slate-200 dark:border-slate-700">
          {% endif %}
          <input type="file" name="image" accept="image/*" class="text-xs text-slate-500">
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-4">
        <a href="{% url 'product_master' %}" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-700">Cancel</a>
        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-6 py-2 rounded-xl text-xs uppercase tracking-wider transition">
          Update Product Detail
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
