{% extends "sku_manager/base.html" %}

{% block title %}Live Camera Scanner - Velfira{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-5">
  
  <!-- Header -->
  <header class="flex items-center justify-between border-b border-slate-800 pb-3">
    <div class="flex items-center gap-2.5">
      <span class="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span>
      <h1 class="text-xl font-extrabold text-white">Live Barcode / QR Scanner</h1>
    </div>
    <span class="text-xs font-mono text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded">
      Auto-Focus Active
    </span>
  </header>

  <!-- Scanner Container Card -->
  <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
    
    <!-- Camera Viewport Box -->
    <div class="relative bg-black rounded-2xl overflow-hidden aspect-square sm:aspect-video flex items-center justify-center border-2 border-slate-800 shadow-inner">
      <div id="reader" class="w-full h-full"></div>

      <!-- Aim Crosshair Overlay -->
      <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
        <div class="w-56 h-56 border-2 border-amber-400/80 rounded-2xl relative shadow-[0_0_20px_rgba(251,191,36,0.3)]">
          <div class="absolute -top-1 -left-1 w-5 h-5 border-t-4 border-l-4 border-amber-400"></div>
          <div class="absolute -top-1 -right-1 w-5 h-5 border-t-4 border-r-4 border-amber-400"></div>
          <div class="absolute -bottom-1 -left-1 w-5 h-5 border-b-4 border-l-4 border-amber-400"></div>
          <div class="absolute -bottom-1 -right-1 w-5 h-5 border-b-4 border-r-4 border-amber-400"></div>
          <div class="w-full h-0.5 bg-rose-500/80 absolute top-1/2 -translate-y-1/2 animate-pulse"></div>
        </div>
      </div>
    </div>

    <!-- Scanner Status Info -->
    <div id="scannerStatus" class="text-center text-xs font-semibold text-slate-400 py-1 flex items-center justify-center gap-2">
      <svg class="w-4 h-4 text-emerald-400 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      <span>Point camera at any jewelry product tag QR code...</span>
    </div>

    <!-- Manual Fallback Input Box -->
    <div class="border-t border-slate-800 pt-3">
      <div class="text-[11px] uppercase font-bold text-slate-500 mb-2">Or Enter SKU Manually:</div>
      <form id="manualForm" class="flex gap-2">
        <input type="text" id="manualSkuInput" placeholder="e.g. NCK-PND-PUFFHRT-GLD-ADJ-001" 
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono uppercase text-white placeholder-slate-600 focus:outline-none focus:border-amber-500">
        <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition">
          Open Item
        </button>
      </form>
    </div>

  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<!-- Load html5-qrcode Library from CDN -->
<script src="https://unpkg.com/html5-qrcode"></script>

<script>
  let html5QrcodeScanner;
  let isScanningHandled = false;

  // Audio feedback on successful scan
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = 880; // A5 note
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch (e) {
      console.log("AudioContext blocked until user interaction.");
    }
  }

  function handleScannedResult(decodedText) {
    if (isScanningHandled) return;
    isScanningHandled = true;

    playBeep();
    document.getElementById('scannerStatus').innerHTML = `
      <span class="text-emerald-400 font-bold">✓ Tag Detected! Redirecting to Dispatch Station...</span>
    `;

    // Extract SKU code whether the scanned QR is a direct URL or just raw SKU text
    let targetSku = decodedText.trim();
    if (targetSku.includes('/dispatch/')) {
      // If QR encodes full URL like http://.../dispatch/SKU-CODE/
      const parts = targetSku.split('/dispatch/');
      targetSku = parts[1].replace(/\/$/, '');
    }

    // Redirect to dispatch view
    window.location.href = `/dispatch/${targetSku}/`;
  }

  function startScanner() {
    html5QrcodeScanner = new Html5Qrcode("reader");

    const config = {
      fps: 15,
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      }
    };

    // Prefer back camera (environment) on mobile devices
    html5QrcodeScanner.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        handleScannedResult(decodedText);
      },
      (errorMessage) => {
        // Continuous scan loop frame misses are normal
      }
    ).catch(err => {
      document.getElementById('scannerStatus').innerHTML = `
        <span class="text-rose-400">Camera error: Please allow camera permissions in browser settings.</span>
      `;
    });
  }

  // Handle manual input fallback
  document.getElementById('manualForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const val = document.getElementById('manualSkuInput').value.trim();
    if (val) {
      window.location.href = `/dispatch/${encodeURIComponent(val)}/`;
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    startScanner();
  });

  // Stop camera when navigating away to save battery
  window.addEventListener('beforeunload', () => {
    if (html5QrcodeScanner) {
      html5QrcodeScanner.stop().catch(() => {});
    }
  });
</script>
{% endblock %}
